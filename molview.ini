; MolView WLX Plugin – Konfigurationsdatei
; Diese Datei liegt im selben Verzeichnis wie MolView.wlx64
; -------------------------------------------------------

[MolView]

; Kommandozeile für den 2D-Modus (SVG-Ausgabe).
; Der Platzhalter hinter -O wird automatisch durch eine
; eindeutige Temp-Datei ersetzt.
; Format: <obabel.exe> <inputfile> CommandLine2D OBabelOpts
CmdLine2D=-O tempfile.svg

; Kommandozeile für den 3D-Modus (SVG-Ausgabe).
;CmdLine3D=-O tempfile.stl --gen3d --best -h
CmdLine3D=-opdb -O tempfile.pdb -h --gen3d

; Heading in der 2D-Ansicht ausblenden (gleich wie Taste H auf "Off")
; false = anzeigen, true = ausblenden
HideHeading=false

; Logging: 1 = aktiv, 0 = deaktiviert
; Logdatei: <PluginDir>\molview_debug.log
Logging=0

; Zusätzliche Optionen, die IMMER an obabel angehängt werden
; (unabhängig vom Modus, nach CommandLine2D/3D).
; Beispiele:  -xC -xs    (Kekulé-Darstellung, keine Wasserstoffe)
;             --errorlevel 0   (stille Fehlerausgabe)
OBabelOpts=

; Vollständiger Pfad zu obabel.exe.
; Leer lassen → Plugin sucht automatisch:
;   1. <PluginDir>\obabel.exe
;   2. <PluginDir>\obabel\obabel.exe
;   3. C:\Program Files\OpenBabel\obabel.exe
;   4. C:\Program Files\OpenBabel-3.1.1\obabel.exe
;   5. C:\Program Files (x86)\OpenBabel\obabel.exe
;   6. C:\OpenBabel\obabel.exe
;   7. obabel.exe im System-PATH
OBabelPath=C:\Program Files\OpenBabel-3.1.1\obabel.exe

; Wasserstoff in PDB-3D anzeigen
ShowHydrogen=true

; Optional: Elementfarben überschreiben (CPK-Defaults sonst automatisch)
;Color.C=#8C8C8C
;Color.H=#FFFFFF
;Color.N=#3366F2
;Color.O=#F02828
;Color.S=#F2D828
;Color.P=#FF7A1A
;Color.Cl=#33CC33

; Startmodus: 2D (Default) oder 3D
;   2D  → obabel erzeugt STL, Anzeige im 3D-Renderer
;   3D  → obabel erzeugt SVG, Anzeige im 2D-SVG-Renderer
StartMode=2D
